# This workflow will run tests using node and then publish a package to the npm registry when a release is created,
# using npm Trusted Publishing (OIDC) - see https://docs.npmjs.com/trusted-publishers
# The trusted publisher must be registered on npmjs.com for this repo + workflow file before a release is created.

name: Node.js Package Publish

on:
  release:
    types: [created]

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Active LTS; also bundles npm >= 11.5, required for Trusted Publishing
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm publish
